<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Questionnaire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .question-container {
            transition: opacity 0.3s ease-in-out;
            min-height: 250px; /* Provides a consistent height */
        }

        .option-btn {
            transition: background-color 0.2s ease-in-out, transform 0.2s ease-in-out;
        }

            .option-btn:hover {
                transform: translateY(-2px);
            }
        /* Style for disabled button */
        #submitButton:disabled {
            background-color: #9ca3af; /* gray-400 */
            cursor: not-allowed;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- MTurk requires the form to be submitted. The action URL will be provided by MTurk in the 'turkSubmitTo' parameter. -->
    <form id="mturk_form" method="POST" action="https://workersandbox.mturk.com/mturk/externalSubmit" class="container mx-auto p-4 lg:p-8 min-h-screen flex flex-col">
        <!-- This hidden field is required by MTurk and will be populated automatically. -->
        <input type="hidden" id="assignmentId" name="assignmentId" value="">
        <!-- This hidden field will store the final answer. -->
        <input type="hidden" id="emotionResult" name="emotion" value="">

        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900">OCC Emotion Model Questionnaire</h1>
            <p class="text-md text-gray-600 mt-2">Analyze a character's emotional reaction by answering the questions below.</p>
        </header>

        <main class="flex-grow grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Left Side: Video Player -->
            <div class="bg-white rounded-xl shadow-lg p-4 flex flex-col items-center justify-center">
                <div class="aspect-w-16 aspect-h-9 w-full">
                    <iframe class="rounded-lg w-full h-full"
                            src="https://www.youtube.com/embed/dQw4w9WgXcQ"
                            title="YouTube video player"
                            frameborder="0"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                            allowfullscreen>
                    </iframe>
                </div>
                <p class="text-sm text-gray-500 mt-4 text-center">Watch the character in the video and use the questionnaire to identify their emotion.</p>
            </div>

            <!-- Right Side: Interactive Questionnaire -->
            <div class="bg-white rounded-xl shadow-lg p-6 md:p-8 flex flex-col justify-between">
                <div id="questionnaire">
                    <!-- Questions will be dynamically inserted here -->
                </div>
                <div class="mt-6 pt-6 border-t">
                    <button type="submit" id="submitButton" class="w-full p-3 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 option-btn">
                        Submit Answer
                    </button>
                    <button type="button" onclick="restart()" class="w-full p-3 mt-3 bg-gray-200 text-gray-700 font-semibold rounded-lg hover:bg-gray-300 option-btn">
                        Start Over
                    </button>
                </div>
            </div>
        </main>
    </form>

    <script>// --- DATA STRUCTURE (No changes) ---
        const questionnaireTree = {
            'start': { text: "Do you think the character's emotional reaction is about an <strong>event</strong>?", options: [{ text: "Yes", next: 'q_eventAffect' }, { text: "No", next: 'q_isAction' }] },
            'q_eventAffect': { text: "Who does the event affect?", options: [{ text: "The character", next: 'q_isOutcome' }, { text: "Someone else", next: 'q_otherOutcomePleasant' }] },
            'q_isOutcome': { text: "Is the emotion related to the <strong>outcome</strong> of an event?", options: [{ text: "Yes, it's about a potential outcome.", next: 'q_isOutcomeConfirmed' }, { text: "No, it's about the event itself.", next: 'q_eventPleasant' }] },
            'q_isOutcomeConfirmed': { text: "Is the outcome confirmed?", options: [{ text: "Yes, it is confirmed the outcome <strong>will</strong> happen.", next: 'q_confirmedPleasant' }, { text: "Yes, it is confirmed the outcome will <strong>NOT</strong> happen.", next: 'q_disconfirmedPleasant' }, { text: "No, the outcome is still uncertain.", next: 'q_hopeful' }] },
            'q_confirmedPleasant': { text: "Is it a pleasant outcome for the character?", options: [{ text: "Yes", next: 'e_satisfaction' }, { text: "No", next: 'e_fearsConfirmed' }] },
            'q_disconfirmedPleasant': { text: "Is this disconfirmation pleasant for the character?", options: [{ text: "Yes", next: 'e_relief' }, { text: "No", next: 'e_disappointment' }] },
            'q_hopeful': { text: "Is the character hoping for a pleasant outcome?", options: [{ text: "Yes", next: 'e_hope' }, { text: "No", next: 'e_fear' }] },
            'q_eventPleasant': { text: "Is the event pleasant for the character?", options: [{ text: "Yes", next: 'e_joy' }, { text: "No", next: 'e_distress' }] },
            'q_otherOutcomePleasant': { text: "Is the event's outcome pleasant for the other person?", options: [{ text: "Yes, the outcome is pleasant for them.", next: 'q_likesOtherHappy' }, { text: "No, the outcome is unpleasant for them.", next: 'q_likesOtherUnhappy' }] },
            'q_likesOtherHappy': { text: "Does the character like this person?", options: [{ text: "Yes", next: 'e_happyFor' }, { text: "No", next: 'e_resentment' }] },
            'q_likesOtherUnhappy': { text: "Does the character like this person?", options: [{ text: "Yes", next: 'e_pity' }, { text: "No", next: 'e_gloating' }] },
            'q_isAction': { text: "Is the emotion related to a person's <strong>action</strong>?", options: [{ text: "Yes", next: 'q_whoAction' }, { text: "No", next: 'q_isObject' }] },
            'q_whoAction': { text: "Who performed the action?", options: [{ text: "The character (themselves)", next: 'q_selfActionApprove' }, { text: "Someone else", next: 'q_otherActionApprove' }] },
            'q_selfActionApprove': { text: "Does the character approve of their own action?", options: [{ text: "Yes", next: 'e_pride' }, { text: "No", next: 'e_shame' }], followUp: 'q_selfActionCausesEvent' },
            'q_selfActionCausesEvent': { text: "Does this action also cause a pleasant or unpleasant event for the character?", options: [{ text: "Yes, a pleasant event.", next: 'e_gratification' }, { text: "Yes, an unpleasant event.", next: 'e_remorse' }, { text: "No, it does not cause a significant event.", next: null }] },
            'q_otherActionApprove': { text: "Does the character approve of the other's action?", options: [{ text: "Yes", next: 'e_admiration' }, { text: "No", next: 'e_reproach' }], followUp: 'q_otherActionCausesEvent' },
            'q_otherActionCausesEvent': { text: "Does this action also cause a pleasant or unpleasant event for the character?", options: [{ text: "Yes, a pleasant event.", next: 'e_gratitude' }, { text: "Yes, an unpleasant event.", next: 'e_anger' }, { text: "No, it does not cause a significant event.", next: null }] },
            'q_isObject': { text: "Is it related to an <strong>aspect</strong> of an object or sensation?", options: [{ text: "Yes", next: 'q_objectAppealing' }, { text: "No, none of the above.", next: 'e_unknown' }] },
            'q_objectAppealing': { text: "Does the character find this aspect appealing?", options: [{ text: "Yes", next: 'e_like' }, { text: "No", next: 'e_dislike' }] },
            'e_satisfaction': { emotion: "Satisfaction" }, 'e_fearsConfirmed': { emotion: "Fears-Confirmed" }, 'e_relief': { emotion: "Relief" }, 'e_disappointment': { emotion: "Disappointment" }, 'e_hope': { emotion: "Hope" }, 'e_fear': { emotion: "Fear" }, 'e_joy': { emotion: "Joy" }, 'e_distress': { emotion: "Distress" }, 'e_happyFor': { emotion: "Happy-for" }, 'e_resentment': { emotion: "Resentment" }, 'e_pity': { emotion: "Pity" }, 'e_gloating': { emotion: "Gloating" }, 'e_pride': { emotion: "Pride" }, 'e_shame': { emotion: "Shame" }, 'e_gratification': { emotion: "Gratification (Pride + Joy)" }, 'e_remorse': { emotion: "Remorse (Shame + Distress)" }, 'e_admiration': { emotion: "Admiration" }, 'e_reproach': { emotion: "Reproach" }, 'e_gratitude': { emotion: "Gratitude (Admiration + Joy)" }, 'e_anger': { emotion: "Anger (Reproach + Distress)" }, 'e_like': { emotion: "Like" }, 'e_dislike': { emotion: "Dislike" }, 'e_unknown': { emotion: "Undetermined" }
        };

        // --- MTURK HELPER FUNCTION ---
        // This function gets parameters from the URL.
        function gup(name, url) {
            if (!url) url = location.href;
            name = name.replace(/[\[]/, "\\\[").replace(/[\]]/, "\\\]");
            var regexS = "[\\?&]" + name + "=([^&#]*)";
            var regex = new RegExp(regexS);
            var results = regex.exec(url);
            return results == null ? "" : decodeURIComponent(results[1].replace(/\+/g, " "));
        }

        const questionnaireDiv = document.getElementById('questionnaire');
        const submitButton = document.getElementById('submitButton');
        const emotionInput = document.getElementById('emotionResult');
        let currentEmotion = null;

        function renderNode(nodeId) {
            const node = questionnaireTree[nodeId];
            questionnaireDiv.style.opacity = 0;
            setTimeout(() => {
                if (node.emotion) {
                    displayResult(node.emotion, node.followUp);
                } else {
                    displayQuestion(nodeId);
                }
                questionnaireDiv.style.opacity = 1;
            }, 300);
        }

        function displayQuestion(nodeId) {
            const node = questionnaireTree[nodeId];
            let html = `<div class="question-container">
                    <h2 class="text-xl md:text-2xl font-semibold mb-6">${node.text}</h2>
                    <div class="space-y-3">`;
            node.options.forEach(option => {
                html += `<button type="button" class="w-full text-left p-4 bg-gray-100 hover:bg-indigo-100 rounded-lg option-btn" onclick="handleOptionClick('${option.next}', '${nodeId}')">${option.text}</button>`;
            });
            html += `</div></div>`;
            questionnaireDiv.innerHTML = html;
        }

        function displayResult(emotion, followUpId) {
            currentEmotion = emotion;
            emotionInput.value = emotion; // Set hidden input for submission
            const followUpNode = questionnaireTree[followUpId];
            let html = `<div class="text-center question-container">
                              <p class="text-lg text-gray-600 mb-2">Identified Emotion:</p>
                              <h2 class="text-4xl md:text-5xl font-bold text-indigo-600 mb-6">Thank you for your participation. You may submit your results.</h2>`;

         
            <!--if (followUpNode) {
                html += `<div class="mt-6 pt-6 border-t border-gray-200">
                                <h3 class="text-xl font-semibold mb-4">${followUpNode.text}</h3>
                                <div class="space-y-3">`;
                followUpNode.options.forEach(option => {
                    const nextNode = option.next ? `'${option.next}'` : null;
                    html += `<button type="button" class="w-full text-left p-4 bg-gray-100 hover:bg-indigo-100 rounded-lg option-btn" onclick="handleFollowUpClick(${nextNode})">${option.text}</button>`;
                });
                html += `</div></div>`;
            } else {
                // Only enable the submit button when there are no more follow-up questions.
                if (document.getElementById('assignmentId').value !== "ASSIGNMENT_ID_NOT_AVAILABLE") {
                    submitButton.disabled = false;
                }
                html += `<p class="text-green-600 font-semibold mt-4">Task complete! You may now submit.</p>`;
            }-->
            html += `</div>`;
            questionnaireDiv.innerHTML = html;
        }

        function handleOptionClick(nextNodeId, currentNodeId) {
            if (nextNodeId) {
                const currentNode = questionnaireTree[currentNodeId];
                const nextNode = questionnaireTree[nextNodeId];
                if (nextNode.emotion) {
                    displayResult(nextNode.emotion, currentNode.followUp);
                } else {
                    renderNode(nextNodeId);
                }
            }
        }

        function handleFollowUpClick(nextNodeId) {
            if (nextNodeId) {
                renderNode(nextNodeId);
            } else {
                displayResult(currentEmotion, null);
            }
        }

        function restart() {
            currentEmotion = null;
            emotionInput.value = "";
            submitButton.disabled = true;
            renderNode('start');
        }

        // --- INITIALIZATION ---
        window.onload = () => {
            const assignmentId = gup('assignmentId', window.location.href);
            document.getElementById('assignmentId').value = assignmentId;

            // Set the form's action to the URL provided by MTurk
            const turkSubmitTo = gup('turkSubmitTo', window.location.href);
            if (turkSubmitTo) {
                document.getElementById('mturk_form').action = turkSubmitTo + '/mturk/externalSubmit';
            }

            // In preview mode, the assignmentId is "ASSIGNMENT_ID_NOT_AVAILABLE"
            // We update the button text to inform the worker they must accept the HIT.
            if (assignmentId === "ASSIGNMENT_ID_NOT_AVAILABLE") {
                submitButton.innerText = "Accept HIT to Enable Submit";
            }

            restart();
        };</script>
</body>
</html>
